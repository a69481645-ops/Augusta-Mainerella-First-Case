<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="sabShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Sabrina Shadowcoat: Gray cat, neutral mercenary, calculating -->
  <g filter="url(#sabShadow)">
    <!-- Body: sleek, business-like coat -->
    <ellipse cx="200" cy="350" rx="52" ry="75" fill="#3a3a3a"/>
    <!-- Head -->
    <circle cx="200" cy="180" r="48" fill="#4a4a4a"/>
    <!-- Ears: alert, listening -->
    <polygon points="170,115 158,65 178,105" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="1"/>
    <polygon points="230,115 242,65 222,105" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="1"/>
    <!-- Inner ear -->
    <polygon points="170,120 163,85 175,110" fill="#555"/>
    <polygon points="230,120 237,85 225,110" fill="#555"/>
    <!-- Eyes: pale gray, calculating gaze -->
    <circle cx="185" cy="165" r="7" fill="#aaaaaa" opacity="0.8"/>
    <circle cx="215" cy="165" r="7" fill="#aaaaaa" opacity="0.8"/>
    <!-- Pupils -->
    <circle cx="185" cy="167" r="3" fill="#000"/>
    <circle cx="215" cy="167" r="3" fill="#000"/>
    <!-- Muzzle: stoic, no expression -->
    <ellipse cx="200" cy="200" rx="22" ry="20" fill="#555"/>
    <!-- Mouth: straight line, neutral -->
    <line x1="190" y1="205" x2="210" y2="205" stroke="#333" stroke-width="1.5"/>
    <!-- Whiskers: cold, precise -->
    <line x1="160" y1="195" x2="125" y2="190" stroke="#666" stroke-width="1" opacity="0.7"/>
    <line x1="160" y1="210" x2="125" y2="215" stroke="#666" stroke-width="1" opacity="0.7"/>
    <line x1="240" y1="195" x2="275" y2="190" stroke="#666" stroke-width="1" opacity="0.7"/>
    <line x1="240" y1="210" x2="275" y2="215" stroke="#666" stroke-width="1" opacity="0.7"/>
    <!-- Tail: coiled, ready -->
    <path d="M 160 390 Q 130 360 125 320" stroke="#3a3a3a" stroke-width="11" fill="none" stroke-linecap="round"/>
  </g>
</svg>
