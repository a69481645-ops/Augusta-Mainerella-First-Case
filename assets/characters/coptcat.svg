<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="catShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="catFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
  </defs>
  
  <!-- Coptcat: Spirit cat, telepathic, mouth closed -->
  <g filter="url(#catShadow)">
    <!-- Body: cat form, ethereal -->
    <ellipse cx="200" cy="360" rx="50" ry="70" fill="url(#catFur)"/>
    <!-- Head -->
    <circle cx="200" cy="180" r="48" fill="#1a1a1a"/>
    <!-- Ears: pointed, alert -->
    <polygon points="170,120 160,70 180,110" fill="#0d0d0d" stroke="#333" stroke-width="1"/>
    <polygon points="230,120 240,70 220,110" fill="#0d0d0d" stroke="#333" stroke-width="1"/>
    <!-- Inner ear -->
    <polygon points="170,125 165,95 175,115" fill="#333"/>
    <polygon points="230,125 235,95 225,115" fill="#333"/>
    <!-- Muzzle: CLOSED MOUTH (telepathic) -->
    <ellipse cx="200" cy="200" rx="20" ry="18" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Eyes: glowing cyan, ancestor wisdom -->
    <circle cx="185" cy="165" r="7" fill="#00ffff" opacity="0.9"/>
    <circle cx="215" cy="165" r="7" fill="#00ffff" opacity="0.9"/>
    <!-- Pupils -->
    <circle cx="185" cy="167" r="3" fill="#000"/>
    <circle cx="215" cy="167" r="3" fill="#000"/>
    <!-- Whiskers: ethereal glow -->
    <line x1="160" y1="190" x2="130" y2="188" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <line x1="160" y1="200" x2="130" y2="202" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <line x1="240" y1="190" x2="270" y2="188" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <line x1="240" y1="200" x2="270" y2="202" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <!-- Tail: flowing, ethereal -->
    <path d="M 160 380 Q 120 370 100 330 Q 90 300 110 280" stroke="#1a1a1a" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Paws -->
    <circle cx="175" cy="420" r="12" fill="#0f0f0f" stroke="#333" stroke-width="1"/>
    <circle cx="225" cy="420" r="12" fill="#0f0f0f" stroke="#333" stroke-width="1"/>
  </g>
</svg>
