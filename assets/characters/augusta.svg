<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="charShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="skinTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#c49060"/>
    </linearGradient>
  </defs>
  
  <!-- Augusta Mainerella: Glamour photographer, dark jeans/boots, camera strap, determined expression -->
  <g filter="url(#charShadow)">
    <!-- Body -->
    <ellipse cx="200" cy="350" rx="55" ry="80" fill="#1a1a1a"/>
    <!-- Head -->
    <circle cx="200" cy="180" r="50" fill="url(#skinTone)"/>
    <!-- Hair: brown, shoulder length -->
    <path d="M 150 160 Q 140 120 160 100 Q 200 80 240 100 Q 260 120 250 160" fill="#4a2c1a"/>
    <!-- Eyes: determined amber -->
    <circle cx="185" cy="170" r="6" fill="#d4a844"/>
    <circle cx="215" cy="170" r="6" fill="#d4a844"/>
    <!-- Nose -->
    <path d="M 200 175 L 200 190" stroke="#a0754a" stroke-width="2"/>
    <!-- Mouth: neutral/serious -->
    <path d="M 190 200 Q 200 205 210 200" stroke="#8b5a2b" stroke-width="2" fill="none"/>
    <!-- Camera strap -->
    <path d="M 160 280 Q 200 300 240 280" stroke="#666" stroke-width="3"/>
    <!-- Camera body -->
    <rect x="175" y="285" width="50" height="35" fill="#333" rx="4"/>
    <!-- Camera lens -->
    <circle cx="200" cy="302" r="12" fill="#111" stroke="#555" stroke-width="1"/>
    <!-- Boots: heavy combat style -->
    <rect x="175" y="420" width="20" height="60" fill="#0a0a0a" rx="3"/>
    <rect x="205" y="420" width="20" height="60" fill="#0a0a0a" rx="3"/>
  </g>
</svg>
